<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/aurevon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <meta name="description" content="Aurevon — AI-powered music player. Search, stream, and discover with intelligent recommendations." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/aurevon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
    <script id="tailwind-config">
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          corePlugins: { preflight: false },
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "surface-variant": "var(--surface-container-highest)", 
                "surface-container": "var(--surface-container)", 
                "secondary": "var(--text-secondary)", 
                "on-primary": "var(--on-primary)", 
                "on-surface": "var(--text-primary)", 
                "tertiary": "var(--accent-tertiary)", 
                "surface-container-lowest": "var(--bg-dark)", 
                "surface-container-high": "var(--surface-container-high)", 
                "surface-tint": "var(--accent-green)", 
                "primary": "var(--primary)", 
                "outline": "var(--text-muted)", 
                "surface": "var(--bg-primary)", 
                "surface-dim": "var(--bg-dark)", 
                "primary-container": "var(--accent-green-container)", 
                "surface-container-highest": "var(--surface-container-highest)", 
                "background": "var(--bg-dark)", 
                "surface-bright": "var(--surface-bright)", 
                "on-surface-variant": "var(--on-surface-variant)", 
                "error": "var(--error)", 
                "surface-container-low": "var(--surface-container-low)"
              },
              fontFamily: { "headline": ["Outfit", "sans-serif"], "body": ["Plus Jakarta Sans", "sans-serif"], "label": ["Plus Jakarta Sans", "sans-serif"] },
              borderRadius: {"DEFAULT": "0.75rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"}
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .glass { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
      .neon-glow { box-shadow: 0 0 40px rgba(114, 254, 143, 0.15); }
      .neon-glow:hover { box-shadow: 0 0 50px rgba(114, 254, 143, 0.25); }
      .font-headline { font-family: 'Outfit', sans-serif; }
    </style>
    <title>Aurevon — AI Music Player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
